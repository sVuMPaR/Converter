name: Build and Release Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g., v1.0.0)'
        required: true

jobs:

build-windows:
  runs-on: windows-latest
  timeout-minutes: 90

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check main.py exists
      shell: cmd
      run: |
        if not exist main.py (
          echo Error: main.py not found!
          exit /b 1
        )

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

      - name: PyInstaller version
        run: pyinstaller --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name converter main.py

      - name: List dist/ contents
        run: ls -la dist/ || echo "dist/ is empty"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows
          path: dist/**
          if-no-files-found:
