name: Build and Release Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g., v1.0.2)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files
        shell: pwsh
        run: |
          $files = @("main.py", "changelog.txt")
          foreach ($f in $files) {
            if (-not (Test-Path $f -PathType Leaf)) {
              Write-Error "File missing: $f"
              exit 1
            }
          }
          Write-Host "All required files found"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if exist requirements.txt (
            pip install -r requirements.txt
          )
          pip install pyinstaller pillow pillow-heif
        shell: cmd

      - name: Build Executable
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --onefile ^
            --windowed ^
            --name converter ^
            main.py

          if not exist "dist\converter.exe" (
            echo Build failed: dist\converter.exe not found!
            exit /b 1
          )

          echo Executable created: dist\converter.exe

      - name: Upload Artifact (wildcard + rename)
        uses: actions/upload-artifact@v4
        with:
          name: converter
          path: "**/converter.exe"
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tag || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Debug files in dist
        run: |
          echo "=== Файлы после загрузки артефактов ==="
          ls -R dist

      - name: Determine version and rename file
        id: version
        run: |
          VERSION=${{ github.event.inputs.tag || github.ref_name }}
          CLEAN_VERSION=${VERSION#refs/tags/}
          EXE_PATH=$(find dist -type f -name "converter.exe" | head -n 1)

          if [ -z "$EXE_PATH" ]; then
            echo "converter.exe не найден!"
            exit 1
          fi

          NEW_NAME="MyApp-${CLEAN_VERSION}.exe"
          mv "$EXE_PATH" "dist/${NEW_NAME}"
          echo "version_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "Переименовано в dist/${NEW_NAME}"

      - name: Read changelog
        id: changelog
        run: |
          if [ -f "dist/changelog.txt" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat dist/changelog.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=No changelog found." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: |
            dist/${{ steps.version.outputs.version_name }}
            dist/changelog.txt
          body: ${{ steps.changelog.outputs.changelog }}
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true

