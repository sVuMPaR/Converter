name: Build and Release Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g., v1.0.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main.py exists
        shell: cmd
        run: |
          if not exist main.py (
            echo Error: main.py not found!
            exit /b 1
          )

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verify Python version
        run: python --version
        shell: cmd

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
        shell: cmd

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
        shell: cmd

      - name: Install requirements (if exists)
        run: |
          if exist requirements.txt (
            python -m pip install -r requirements.txt
          ) else (
            echo "requirements.txt not found"
          )
        shell: cmd

      - name: Verify PyInstaller is importable
        run: python -c "import pyinstaller; print('PyInstaller imported successfully')"
        shell: cmd

      - name: PyInstaller version
        run: pyinstaller --version
        shell: cmd

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name converter main.py
        shell: cmd

      - name: List dist/ contents
        run: dir dist\ || echo "dist/ is empty"
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows
          path: dist/**
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tag || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: converter-windows
          path: release_artifact

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: release_artifact/**
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
