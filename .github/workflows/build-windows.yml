name: Build and Release Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g., v1.0.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main.py exists
        shell: cmd
        run: |
          if not exist main.py (
            echo Error: main.py not found!
            exit /b 1
          )

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configure Python user paths
        run: |
          :: Получаем путь к пользовательской установке Python
          set PY_USER_SITE=%APPDATA%\Python
          set PY_SCRIPTS=%PY_USER_SITE%\Scripts
          set PY_LIB=%PY_USER_SITE%\Python310\site-packages

          :: Добавляем в PATH для текущих и будущих шагов
          echo %PY_SCRIPTS% >> %GITHUB_PATH%
          echo %PY_LIB% >> %GITHUB_PYTHONPATH%  # Для импорта модулей

          :: Создаём/обновляем файл .pth для Python
          echo %PY_LIB% > %PYTHONUSERBASE%\python310.pth
        shell: cmd

      - name: Install dependencies
        run: |
          :: Обновляем pip (без --user, т.к. это базовая утилита)
          python -m pip install --upgrade pip

          :: Устанавливаем PyInstaller в пользовательскую директорию
          python -m pip install --upgrade pyinstaller --user

          :: Если есть requirements.txt — устанавливаем зависимости из него
          if exist requirements.txt (
            python -m pip install -r requirements.txt --user
          ) else (
            echo "requirements.txt not found, skipping..."
          )
        shell: cmd


      - name: Verify PyInstaller installation
        run: |
          :: Проверяем наличие pyinstaller.exe
          where pyinstaller

          :: Проверяем импорт модуля (важно: регистр!)
          python -c "import PyInstaller; print('PyInstaller imported successfully')"
        shell: cmd

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name converter main.py
        shell: cmd

      - name: List dist/ contents
        run: dir dist\ || echo "dist/ is empty"
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows
          path: dist/**
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tag || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: converter-windows
          path: release_artifact

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: release_artifact/**
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
