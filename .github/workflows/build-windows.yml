name: Build and Release Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g., v1.0.2)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files
        shell: pwsh
        run: |
          $files = @("main.py", "changelog.txt")
          foreach ($f in $files) {
            if (-not (Test-Path $f -PathType Leaf)) {
              Write-Error "File missing: $f"
              exit 1
            }
          }
          Write-Host "All required files found"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if exist requirements.txt (
            pip install -r requirements.txt
          )
          pip install pyinstaller pillow pillow-heif
        shell: cmd

      - name: Build Executable
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --onefile ^
            --windowed ^
            --name converter ^
            main.py
          
          if not exist "dist\converter.exe" (
            echo "Build failed: dist\converter.exe not found!"
            exit /b 1
          )
          echo "Executable created: dist\converter.exe"

      - name: Upload Artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: converter
          path: dist/converter.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tag || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: converter
          path: dist

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: dist/converter.exe:MyApp-${{ github.ref_name }}.exe
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true  # перезаписывать релиз при повторном запуске
