name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: (Optional) Show PyQt plugins path
        run: |
          python - <<'PY'
          import os, importlib
          try:
              m = importlib.import_module('PyQt5')
              print(os.path.join(os.path.dirname(m.__file__), 'Qt', 'plugins'))
          except Exception as e:
              print('PyQt5 not found or error:', e)
          PY

      - name: Build with PyInstaller
        run: |
          # При необходимости добавьте --add-data "C:\path\to\plugins;PyQt5/Qt/plugins"
          pyinstaller --noconfirm --onefile --windowed --name converter --icon assets/icon.ico main.py

      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows
          path: dist/**

      - name: Upload artifact (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**
