name: Build and Release Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g., v1.0.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main.py exists
        shell: cmd
        run: |
          if not exist main.py (
            echo Error: main.py not found!
            exit /b 1
          )

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configure Python user paths
        run: |
          :: Создаём директорию Python в AppData, если её нет
          if not exist "%APPDATA%\Python" (
            mkdir "%APPDATA%\Python"
          )
          
          :: Настраиваем пути к пользовательским директориям Python
          set "PY_USER_SITE=%APPDATA%\Python"
          set "PY_SCRIPTS=%PY_USER_SITE%\Scripts"
          set "PY_LIB=%PY_USER_SITE%\Python310\site-packages"
          
          :: Добавляем пути в переменные окружения для последующих шагов
          echo "%PY_SCRIPTS%" >> "%GITHUB_PATH%"
          echo "%PY_LIB%" >> "%GITHUB_PYTHONPATH%"
          
          :: Создаём .pth файл для корректного поиска модулей
          echo "%PY_LIB%" > "%PYTHONUSERBASE%\python310.pth"
        shell: cmd

      - name: Install libheif via vcpkg
        run: |
          :: Клонируем репозиторий vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          
          :: Запускаем bootstrap для настройки vcpkg
          .\bootstrap-vcpkg.bat
          
          :: Устанавливаем библиотеку libheif для Windows x64
          vcpkg install libheif:x64-windows
          
          :: Добавляем путь к DLL в PATH для последующих шагов
          echo "C:\vcpkg\installed\x64-windows\bin" >> "%GITHUB_PATH%"
        shell: cmd

      - name: Install dependencies
        run: |
          :: Обновляем pip до последней версии
          python -m pip install --upgrade pip
          
          :: Устанавливаем PyInstaller в пользовательскую директорию
          python -m pip install --upgrade pyinstaller --user
          
          :: Проверяем наличие requirements.txt и устанавливаем зависимости
          if exist requirements.txt (
            python -m pip install -r requirements.txt --user
            echo "Dependencies from requirements.txt installed successfully."
          ) else (
            echo "Error: requirements.txt not found!"
            exit /b 1
          )
        shell: cmd

      - name: Verify module imports
        run: |
          :: Проверяем доступность pyinstaller
          where pyinstaller
          
          :: Проверяем импорт ключевых модулей Python
          python -c "import PyInstaller; print('PyInstaller imported successfully')"
          python -c "from PIL import Image; print('Pillow imported successfully')"
          python -c "import pillow_heif; print('pillow-heif imported successfully')"
        shell: cmd


      - name: Debug Python paths and site-packages
        run: |
          echo "PYTHONPATH: %PYTHONPATH%"
          echo "GITHUB_PYTHONPATH: %GITHUB_PYTHONPATH%"
          dir "%APPDATA%\Python\site-packages" /b /s | findstr /i "pillow-heif"
        shell: cmd

      - name: Build executable
        run: |
          :: Собираем исполняемый файл с помощью PyInstaller
          pyinstaller --noconfirm --onefile --windowed --name converter main.py
        shell: cmd


      - name: List dist/ contents
        run: dir dist\ || echo "dist/ is empty"
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-windows
          path: dist/**
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tag || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: converter-windows
          path: release_artifact

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: release_artifact/**
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
